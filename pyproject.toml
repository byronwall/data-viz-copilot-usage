[project]
name = "llmly"
version = "0.1.3"
description = "Interactive viewer for Copilot and Codex coding-session token usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]
authors = [
    { name = "Byron Wall" },
]
license = "MIT"
keywords = ["llm", "codex", "copilot", "claude", "usage", "tokens", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/byronwall/data-viz-copilot-usage"
Repository = "https://github.com/byronwall/data-viz-copilot-usage"
Issues = "https://github.com/byronwall/data-viz-copilot-usage/issues"

[project.scripts]
llmly = "llmly.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmly"]

[tool.hatch.build.targets.sdist]
include = [
    "/llmly",
    "/analyzer",
    "/app.py",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/publish-llmly.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
